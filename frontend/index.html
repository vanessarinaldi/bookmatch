
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BookMatch | Tu próximo libro</title>

    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <div class="app">

        <!-- Barra lateral -->
        <aside class="sidebar">

            <div class="sidebar-brand">
                <img
                    src="img/bookmatch-logo.png"
                    alt="Logo de BookMatch"
                >
            </div>

            <button id="new-chat" class="new-chat" type="button">
                + Nuevo chat
            </button>


            <div id="chat-history"></div>

            <div class="sidebar-footer">
                Proyecto de aprendizaje
            </div>

        </aside>

        <!-- Chat principal -->
        <main class="chat">

            <header class="chat-header">

                <img
                    src="img/bookmatch-logo.png"
                    alt="Logo de BookMatch"
                    class="header-logo"
                >

                <div>
                    <h1>BookMatch</h1>

                    <span class="status">
                        Tu próximo capítulo empieza aquí
                    </span>
                </div>

            </header>

            <!-- Mensajes y bienvenida -->
            <section
                id="messages"
                class="messages"
                aria-live="polite"
                aria-label="Conversación"
            >

                <div class="welcome">

                    <!-- Imagen del libro cerrado con corazón -->
                    <div class="welcome-icon">
                        <img
                            src="img/libro-corazon.png"
                            alt="Libro cerrado con un corazón rosa"
                        >
                    </div>

                    <h2>¿Qué historia te gustaría descubrir?</h2>

                    <p>
                        Contame qué te gusta leer y encontremos juntos
                        tu próximo libro favorito.
                    </p>

                </div>

            </section>

            <!-- Formulario del chat -->
            <form id="chat-form" class="chat-form">

                <label class="sr-only" for="message-input">
                    Escribí tu mensaje
                </label>

                <input
                    type="text"
                    id="message-input"
                    placeholder="Escribí un mensaje..."
                    autocomplete="off"
                    required
                >

                <button type="submit" id="send-button">
                    Enviar
                </button>

            </form>

            <p class="disclaimer">
                La IA puede cometer errores. Verificá la información.
            </p>

        </main>

    </div>

    <!-- JavaScript del chat -->
    <script src="js/app.js"></script>
</body>
</html>
